buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            classpath("com.android.tools.build:gradle:3.6.1")
        }
    }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.phonesmsretriever'
    compileSdkVersion safeExtGet('OtpVerify_compileSdkVersion', 34)
    defaultConfig {
        minSdkVersion safeExtGet('OtpVerify_minSdkVersion', 21)
        targetSdkVersion safeExtGet('OtpVerify_targetSdkVersion', 34)
        versionCode 2
        versionName "1.0"

    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        disable 'GradleCompatible'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenLocal()
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url("$rootDir/../node_modules/react-native/android")
    }
    google()
    mavenCentral()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-native:+"  // From node_modules
    // Must stay on 20.7.0 for legacy Credentials HintRequest (removed in 21+).
    implementation "com.google.android.gms:play-services-auth:20.7.0"
}

// App-wide force so Firebase / Google Sign-In cannot resolve auth 21.x.
rootProject.allprojects {
    configurations.all {
        resolutionStrategy {
            force "com.google.android.gms:play-services-auth:20.7.0"
        }
    }
}
